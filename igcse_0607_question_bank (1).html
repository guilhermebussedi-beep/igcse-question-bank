<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambridge IGCSE 0607 — Question Bank</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#C0392B;--red-d:#922B21;--red-l:#FADBD8;--red-p:#FDF2F0;
  --g50:#FAFAFA;--g100:#F5F5F5;--g200:#EEEEEE;--g300:#E0E0E0;
  --g400:#BDBDBD;--g500:#9E9E9E;--g600:#757575;--g800:#424242;--g900:#212121;
  --easy:#2E7D32;--easy-bg:#E8F5E9;--easy-b:#A5D6A7;
  --med:#E65100;--med-bg:#FFF3E0;--med-b:#FFCC80;
  --hard:#6A1B9A;--hard-bg:#F3E5F5;--hard-b:#CE93D8;
  --r:10px;--rs:6px;
  --sidebar:230px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F2F2F2;color:var(--g900);min-height:100vh;font-size:14px}

/* HEADER */
.hdr{background:var(--red);color:#fff;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.hdr-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:13px 20px;gap:12px;flex-wrap:wrap}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
.brand p{font-size:11px;opacity:.78;margin-top:2px}
.hstats{display:flex;gap:20px}
.hs{text-align:center}
.hs .n{font-size:20px;font-weight:700;line-height:1}
.hs .l{font-size:10px;opacity:.72;margin-top:2px;text-transform:uppercase;letter-spacing:.4px}

/* LAYOUT */
.app{max-width:1200px;margin:0 auto;padding:16px 14px;display:grid;grid-template-columns:var(--sidebar) 1fr;gap:14px;align-items:start}

/* SIDEBAR */
.sidebar{position:sticky;top:62px;max-height:calc(100vh - 78px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--g300);border-radius:2px}
.fbox{background:#fff;border-radius:var(--r);border:1px solid var(--g200);padding:12px 14px}
.fbox h3{font-size:10px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.fsect{margin-bottom:10px}
.fsect:last-child{margin-bottom:0}
.flbl{font-size:10px;font-weight:600;color:var(--g600);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--g300);background:#fff;color:var(--g700,#555);cursor:pointer;transition:all .1s;user-select:none;line-height:1.4}
.chip:hover{border-color:var(--red);color:var(--red)}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.chip.easy-chip.on{background:var(--easy);border-color:var(--easy)}
.chip.med-chip.on{background:var(--med);border-color:var(--med)}
.chip.hard-chip.on{background:var(--hard);border-color:var(--hard)}
.reset-btn{width:100%;margin-top:10px;padding:7px;border-radius:var(--rs);background:var(--red-p);color:var(--red);font-size:12px;font-weight:600;border:1px solid var(--red-l);cursor:pointer;transition:background .12s}
.reset-btn:hover{background:var(--red-l)}

/* MAIN */
.main{display:flex;flex-direction:column;gap:8px;min-width:0}
.rbar{background:#fff;border-radius:var(--r);border:1px solid var(--g200);padding:9px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--g600)}
.rbar strong{color:var(--g900)}
.ministats{display:flex;gap:12px}
.ms-{font-size:12px;display:flex;align-items:center;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.de{background:var(--easy)}.dm{background:var(--med)}.dh{background:var(--hard)}

/* QUESTION CARD */
.qcard{background:#fff;border-radius:var(--r);border:1px solid var(--g200);overflow:hidden;transition:border-color .12s}
.qcard:hover{border-color:var(--g400)}
.qhead{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.qnum{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.qmeta{flex:1;min-width:0}
.qtags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap;line-height:1.5}
.ty{background:#E3F2FD;color:#0D47A1}
.tp{background:#EDE7F6;color:#4527A0}
.tt{background:var(--red-p);color:var(--red-d);border:1px solid var(--red-l)}
.tsub{background:var(--g100);color:var(--g600)}
.tm{background:var(--g100);color:var(--g500)}
.te{background:var(--easy-bg);color:var(--easy)}
.tme{background:var(--med-bg);color:var(--med)}
.th{background:var(--hard-bg);color:var(--hard)}
.qprev{font-size:12px;color:var(--g500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--g400);font-size:15px;flex-shrink:0;margin-top:3px;transition:transform .18s;line-height:1}
.chev.open{transform:rotate(180deg)}

/* BODY */
.qbody{display:none;border-top:1px solid var(--g200)}
.qbody.open{display:block}
.qinner{padding:14px}

/* QUESTION IMAGE */
.qimg-wrap{background:var(--g50);border-radius:var(--rs);padding:10px;margin-bottom:12px;text-align:center;border:1px solid var(--g200)}
.qimg-wrap img{max-width:100%;height:auto;display:block;margin:0 auto}

/* MS BUTTON & BOX */
.ms-btn{font-size:12px;padding:6px 14px;border-radius:var(--rs);background:transparent;border:1px solid var(--red);color:var(--red);font-weight:600;cursor:pointer;transition:background .12s}
.ms-btn:hover{background:var(--red-p)}
.ms-box{display:none;margin-top:10px;border-radius:var(--rs);border:1px solid var(--red-l);overflow:hidden}
.ms-box.open{display:block}
.ms-lbl{font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.5px;padding:7px 12px;background:var(--red-p);border-bottom:1px solid var(--red-l)}
.ms-img{padding:10px;background:#fff;text-align:center}
.ms-img img{max-width:100%;height:auto;display:block;margin:0 auto}
.ms-text{padding:10px 12px;background:#fff;font-size:13px;line-height:1.7;color:var(--g800)}

/* PAGINATION */
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
.pager button{padding:6px 10px;border-radius:var(--rs);border:1px solid var(--g300);background:#fff;color:var(--g800);font-size:12px;cursor:pointer;min-width:32px;transition:all .1s}
.pager button:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.pager button.cur{background:var(--red);color:#fff;border-color:var(--red)}
.pager button:disabled{opacity:.35;cursor:default}
.pager .pinfo{font-size:12px;color:var(--g600);padding:0 4px}

.empty{text-align:center;padding:50px 20px;background:#fff;border-radius:var(--r);border:1px solid var(--g200);color:var(--g600)}
.empty .ei{font-size:30px;margin-bottom:8px}

@media(max-width:720px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;max-height:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .hstats{display:none}
}
</style>
</head>

// ── STATE ──────────────────────────────────────────────────────────────────
const F = {pt:new Set(),diff:new Set(),year:new Set(),topic:new Set(),sub:new Set()};
const PAGE_SIZE = 20;
let curPage = 1;
let filtered = [];

function tog(el, group, val) {
  if(F[group].has(val)){F[group].delete(val);el.classList.remove('on');}
  else{F[group].add(val);el.classList.add('on');}
  // If topic changed, rebuild sub chips
  if(group==='topic') buildSubChips();
  curPage=1; render();
}

function reset() {
  Object.keys(F).forEach(k=>F[k].clear());
  document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));
  buildSubChips();
  curPage=1; render();
}

// ── BUILD DYNAMIC CHIPS ────────────────────────────────────────────────────
function buildChips() {
  const years  = [...new Set(Q.map(q=>q.year))].sort();
  const topics = [...new Set(Q.map(q=>q.topic))].sort();

  document.getElementById('yearChips').innerHTML = years.map(y=>
    `<span class="chip" onclick="tog(this,'year',${JSON.stringify(y)})">${y}</span>`).join('');

  document.getElementById('topicChips').innerHTML = topics.map(t=>
    `<span class="chip" onclick="tog(this,'topic',${JSON.stringify(t)})">${t}</span>`).join('');

  buildSubChips();
}

function buildSubChips() {
  // Show subtopics filtered by selected topics (or all if none selected)
  const activeTopic = F.topic.size > 0 ? F.topic : new Set(Q.map(q=>q.topic));
  const subs = [...new Set(Q.filter(q=>activeTopic.has(q.topic)).map(q=>q.sub))].sort();
  // Clear sub selections that are no longer visible
  F.sub.forEach(s=>{ if(!subs.includes(s)) F.sub.delete(s); });
  document.getElementById('subChips').innerHTML = subs.map(s=>
    `<span class="chip${F.sub.has(s)?' on':''}" onclick="tog(this,'sub',${JSON.stringify(s)})">${s.replace(/^E[\d.]+\s*/,'')}</span>`).join('');
}

// ── FILTER ─────────────────────────────────────────────────────────────────
function getFiltered() {
  return Q.filter(q=>
    (!F.pt.size    || F.pt.has(q.pt))   &&
    (!F.year.size  || F.year.has(q.year)) &&
    (!F.topic.size || F.topic.has(q.topic)) &&
    (!F.sub.size   || F.sub.has(q.sub)) &&
    (!F.diff.size  || F.diff.has(q.diff))
  );
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function dcls(d){return d==='Easy'?'te':d==='Medium'?'tme':'th';}
function demoji(d){return d==='Easy'?'🟢':d==='Medium'?'🟡':'🔴';}

function render() {
  filtered = getFiltered();
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total/PAGE_SIZE));
  if(curPage>pages) curPage=pages;

  document.getElementById('countLbl').textContent = total;
  document.getElementById('cE').textContent = filtered.filter(q=>q.diff==='Easy').length;
  document.getElementById('cM').textContent = filtered.filter(q=>q.diff==='Medium').length;
  document.getElementById('cH').textContent = filtered.filter(q=>q.diff==='Hard').length;

  const slice = filtered.slice((curPage-1)*PAGE_SIZE, curPage*PAGE_SIZE);
  const el = document.getElementById('qList');

  if(!slice.length){
    el.innerHTML='<div class="empty"><div class="ei">🔍</div>No questions match these filters.</div>';
    document.getElementById('pager').innerHTML='';
    return;
  }

  el.innerHTML = slice.map((q,i)=>{
    const globalIdx = (curPage-1)*PAGE_SIZE + i + 1;
    const hasMS = q.msimg || q.ms;
    return `<div class="qcard" id="c${q.id}">
      <div class="qhead" onclick="openQ(${q.id})">
        <div class="qnum">${globalIdx}</div>
        <div class="qmeta">
          <div class="qtags">
            <span class="tag ty">${q.year}</span>
            <span class="tag tp">P${q.paper}</span>
            <span class="tag tt">${q.topic}</span>
            <span class="tag tsub">${q.sub.replace(/^E[\d.]+\s*/,'')}</span>
            ${q.marks!=='0'?`<span class="tag tm">${q.marks}m</span>`:''}
            <span class="tag ${dcls(q.diff)}">${demoji(q.diff)} ${q.diff}</span>
          </div>
          <div class="qprev">${q.sub}</div>
        </div>
        <span class="chev" id="chev${q.id}">▾</span>
      </div>
      <div class="qbody" id="b${q.id}">
        <div class="qinner">
          <div class="qimg-wrap">
            <img src="${q.qimg}" alt="Question ${globalIdx}" loading="lazy" onerror="this.parentElement.innerHTML='<em style=color:#999>Image unavailable</em>'">
          </div>
          ${hasMS ? `<button class="ms-btn" onclick="openMS(${q.id},event)">Show mark scheme</button>
          <div class="ms-box" id="ms${q.id}">
            <div class="ms-lbl">Mark Scheme</div>
            ${q.msimg ? `<div class="ms-img"><img src="${q.msimg}" alt="Mark scheme" loading="lazy" onerror="this.parentElement.innerHTML='<em style=color:#999>Image unavailable</em>'"></div>` : ''}
            ${q.ms && !q.msimg ? `<div class="ms-text">${q.ms.replace(/\\\\/g,'<br>').replace(/\[(\d+)\]/g,'<strong>[$1]</strong>')}</div>` : ''}
          </div>` : `<span style="font-size:12px;color:var(--g500)">Mark scheme not yet available</span>`}
        </div>
      </div>
    </div>`;
  }).join('');

  renderPager(pages);
}

function openQ(id) {
  const body = document.getElementById('b'+id);
  const chev = document.getElementById('chev'+id);
  const opening = !body.classList.contains('open');
  body.classList.toggle('open', opening);
  chev.classList.toggle('open', opening);
}

function openMS(id, e) {
  e.stopPropagation();
  const box = document.getElementById('ms'+id);
  const btn = e.target;
  const opening = !box.classList.contains('open');
  box.classList.toggle('open', opening);
  btn.textContent = opening ? 'Hide mark scheme' : 'Show mark scheme';
}

// ── PAGER ──────────────────────────────────────────────────────────────────
function renderPager(pages) {
  const pg = document.getElementById('pager');
  if(pages<=1){pg.innerHTML='';return;}

  let btns = '';
  btns += `<button onclick="goPage(${curPage-1})" ${curPage===1?'disabled':''}>‹</button>`;

  const range = [];
  for(let p=1;p<=pages;p++){
    if(p===1||p===pages||Math.abs(p-curPage)<=2) range.push(p);
    else if(range[range.length-1]!=='…') range.push('…');
  }
  range.forEach(p=>{
    if(p==='…') btns+=`<span class="pinfo">…</span>`;
    else btns+=`<button class="${p===curPage?'cur':''}" onclick="goPage(${p})">${p}</button>`;
  });

  btns += `<button onclick="goPage(${curPage+1})" ${curPage===pages?'disabled':''}>›</button>`;
  btns += `<span class="pinfo">${(curPage-1)*PAGE_SIZE+1}–${Math.min(curPage*PAGE_SIZE,filtered.length)} of ${filtered.length}</span>`;
  pg.innerHTML = btns;
}

function goPage(p) {
  curPage = p;
  render();
  document.querySelector('.main').scrollIntoView({behavior:'smooth',block:'start'});
}

buildChips();
render();
</script>
</body>
